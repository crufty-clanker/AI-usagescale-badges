<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="270" height="20" role="img" aria-label="AI Usage Scale: Level 0 — Human">
  <title>AI Usage Scale: Level 0 — Human</title>
  <linearGradient id="a" x2="0" y2="100%">
    <stop offset="0" stop-color="#bbb" stop-opacity=".1"/>
    <stop offset="1" stop-color="#bbb" stop-opacity=".1"/>
  </linearGradient>
  <mask id="m"><rect width="270" height="20" rx="3" fill="#fff"/></mask>
  <g mask="url(#m)">
