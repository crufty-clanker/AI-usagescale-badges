    <rect width="270" height="20" fill="url(#a)"/>
  </g>
  <g fill="#fff" text-anchor="start" font-family="Verdana,Genova,Tahoma, sans-serif" font-size="11" text-rendering="geometricPrecision">
    <text x="6" y="15" transform="scale(.97)" aria-hidden="true">AI Usage Scale</text>
    <text x="132" y="15" transform="scale(.97)" aria-hidden="true">Level 0 — Human</text>
